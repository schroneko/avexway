name: Cloudflare Workers

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Text lint
        run: npm run lint:text

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Text lint
        run: npm run lint:text

      - name: Build
        run: npm run build

      - name: Normalize Cloudflare credentials
        id: cloudflare-credentials
        env:
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAW_CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          account_id="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | grep -Eo '[[:xdigit:]]{32}' | head -n 1 || true)"
          api_key="$(printf '%s' "$RAW_CLOUDFLARE_API_KEY" | tr -d '\r\n' | sed -e 's/^"//' -e 's/"$//')"
          api_token="${RAW_CLOUDFLARE_API_TOKEN#Bearer }"
          api_token="$(printf '%s' "$api_token" | tr -d '\r\n' | sed -e 's/^"//' -e 's/"$//')"
          email="$(printf '%s' "$RAW_CLOUDFLARE_EMAIL" | tr -d '\r\n' | sed -e 's/^"//' -e 's/"$//')"

          if [ -z "$account_id" ]; then
            echo "Cloudflare account ID is empty after normalization." >&2
            exit 1
          fi

          if [ -z "$api_key" ] || [ -z "$email" ]; then
            if [ -z "$api_token" ]; then
              echo "Cloudflare credentials are empty after normalization." >&2
              exit 1
            fi
          fi

          echo "::add-mask::$account_id"

          if [ -n "$api_key" ]; then
            echo "::add-mask::$api_key"
          fi

          if [ -n "$api_token" ]; then
            echo "::add-mask::$api_token"
          fi

          if [ -n "$email" ]; then
            echo "::add-mask::$email"
          fi

          echo "api_key=$api_key" >> "$GITHUB_OUTPUT"
          echo "api_token=$api_token" >> "$GITHUB_OUTPUT"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "email=$email" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers with global API key
        if: steps.cloudflare-credentials.outputs.api_key != '' && steps.cloudflare-credentials.outputs.email != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-credentials.outputs.account_id }}
          CLOUDFLARE_API_KEY: ${{ steps.cloudflare-credentials.outputs.api_key }}
          CLOUDFLARE_EMAIL: ${{ steps.cloudflare-credentials.outputs.email }}
        run: npx wrangler@4.106.0 deploy

      - name: Deploy to Cloudflare Workers with API token fallback
        if: steps.cloudflare-credentials.outputs.api_key == '' || steps.cloudflare-credentials.outputs.email == ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-credentials.outputs.account_id }}
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare-credentials.outputs.api_token }}
        run: npx wrangler@4.106.0 deploy
