name: Cloudflare Workers

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Normalize Cloudflare credentials
        id: cloudflare-credentials
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api_token="${RAW_CLOUDFLARE_API_TOKEN#Bearer }"
          api_token="$(printf '%s' "$api_token" | tr -d '\r\n' | sed -e 's/^"//' -e 's/"$//')"
          account_id="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | grep -Eo '[[:xdigit:]]{32}' | head -n 1 || true)"

          if [ -z "$api_token" ]; then
            echo "Cloudflare API token is empty after normalization." >&2
            exit 1
          fi

          echo "::add-mask::$api_token"
          echo "::add-mask::$account_id"
          echo "api_token=$api_token" >> "$GITHUB_OUTPUT"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Resolve Cloudflare account
        id: cloudflare-account
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare-credentials.outputs.api_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-credentials.outputs.account_id }}
        run: |
          resolved_account_id=""

          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            response_code="$(
              {
                curl --globoff -sS -o /tmp/cloudflare-account-check.json -w '%{http_code}' \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
              } || true
            )"

            if [ "$response_code" = "200" ]; then
              resolved_account_id="$CLOUDFLARE_ACCOUNT_ID"
            fi
          fi

          if [ -z "$resolved_account_id" ]; then
            zone_json="$(
              curl --globoff -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/zones?name=yutahayashi.com"
            )"
            resolved_account_id="$(printf '%s' "$zone_json" | jq -r '.result[0].account.id // empty')"
          fi

          if [ -z "$resolved_account_id" ]; then
            echo "Unable to resolve the Cloudflare account ID from the configured secrets." >&2
            exit 1
          fi

          echo "::add-mask::$resolved_account_id"
          echo "account_id=$resolved_account_id" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare-credentials.outputs.api_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-account.outputs.account_id }}
        run: npx wrangler@4.70.0 deploy
