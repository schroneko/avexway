name: Cloudflare Workers

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve Cloudflare account
        id: cloudflare-account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          account_json="$(npx wrangler@4.70.0 whoami --json)"
          resolved_account_id="$(
            printf '%s' "$account_json" | jq -r --arg preferred "$CLOUDFLARE_ACCOUNT_ID" '
              (.accounts // []) as $accounts
              | if ($preferred | length) > 0 and any($accounts[]?; .id == $preferred) then
                  $preferred
                elif ($accounts | length) == 1 then
                  $accounts[0].id
                else
                  empty
                end
            '
          )"

          if [ -z "$resolved_account_id" ] || [ "$resolved_account_id" = "null" ]; then
            echo "Unable to resolve a unique Cloudflare account ID from the provided token." >&2
            printf '%s' "$account_json" | jq '{accounts: [.accounts[]? | .name]}' >&2
            exit 1
          fi

          echo "::add-mask::$resolved_account_id"
          echo "account_id=$resolved_account_id" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-account.outputs.account_id }}
        run: npx wrangler@4.70.0 deploy
